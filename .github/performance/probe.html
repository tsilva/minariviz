<output id="comparison-probe" hidden>{}</output><script>(()=>{const out=document.getElementById('comparison-probe');const m={sampleId:new URLSearchParams(location.search).get('sample'),lcpMs:null,detailMs:null};let start=null,finishing=false;const write=()=>out.textContent=JSON.stringify(m);new PerformanceObserver(list=>{m.lcpMs=list.getEntries().at(-1).startTime;write()}).observe({type:'largest-contentful-paint',buffered:true});document.addEventListener('click',event=>{if(start===null&&event.target.closest('button[aria-controls="dataset-inspector"]'))start=performance.now()},true);new MutationObserver(()=>{if(start===null||finishing)return;const q=document.getElementById('dataset-inspector');if(q?.querySelector('h2')?.textContent.trim()==='Breakout'&&[...q.querySelectorAll('[role="tab"]')].some(x=>x.textContent.trim()==='Summary')){finishing=true;requestAnimationFrame(()=>requestAnimationFrame(()=>{m.detailMs=performance.now()-start;out.dataset.detailReady='true';write()}))}}).observe(document.body,{childList:true,subtree:true})})();</script>
