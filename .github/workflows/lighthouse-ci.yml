name: Lighthouse comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'tsilva/minariviz' && github.ref == 'refs/heads/codex/lighthouse-comparison-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Brave Stable from its signed release repository
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install --yes brave-browser
          brave-browser --version
      - name: Verify locked browser-tool age and integrity
        run: python3 .github/performance/verify_tool_age.py "$RUNNER_TEMP/performance-tools-ages.json"
      - name: Install locked CI-only browser driver
        working-directory: .github/performance/tools
        run: |
          npm ci --ignore-scripts --min-release-age=7
          npm audit --audit-level=low
      - name: Test comparison boundaries
        run: python3 -B -m unittest discover -s .github/performance -p test_compare.py
      - name: Compare the frozen baseline and candidate
        run: python3 .github/performance/compare.py --kind catalogue --baseline 56f576aa3b30df08f4a30b9f8e3d950df03df81a --output "$RUNNER_TEMP/lighthouse-comparison"
      - name: Export bounded diagnostic evidence through native job logs
        if: always()
        run: python3 .github/performance/export.py --output "$RUNNER_TEMP/lighthouse-comparison"
